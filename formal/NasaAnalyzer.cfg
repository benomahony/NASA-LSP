\* TLC Model Checker configuration for NasaAnalyzer.tla
\* Run with: java -jar tla2tools.jar -config NasaAnalyzer.cfg NasaAnalyzer.tla

SPECIFICATION SpecAnalyzer

\* -----------------------------------------------------------------------
\* Constants
\* -----------------------------------------------------------------------

CONSTANTS
    \* Small function name set — sufficient to expose cross-function bugs
    FunctionName <- {"foo", "bar"}

    \* Scaled-down threshold values for TLC (structure is identical to
    \* production values; only the magnitude differs).
    MAX_LINES = 3
    MIN_ASSERTS = 2

    \* TLC bounds: must satisfy MAX_LINE_COUNT >= MAX_LINES and
    \* MAX_ASSERT_COUNT >= MIN_ASSERTS.  Keep these small to limit
    \* state-space explosion while still covering all threshold cases.
    MAX_LINE_COUNT = 4
    MAX_ASSERT_COUNT = 3

\* -----------------------------------------------------------------------
\* Invariants to check
\* -----------------------------------------------------------------------

INVARIANTS
    DiagnosticsMatchSpec
    NoDiagnosticsForUnknownFunctions
    DiagnosticCodesValid

\* -----------------------------------------------------------------------
\* Theorems (checked as invariants in TLC)
\* -----------------------------------------------------------------------

INVARIANTS
    Nasa05Monotone
    Nasa04AntiMonotone
