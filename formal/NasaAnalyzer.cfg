\* TLC Model Checker configuration for NasaAnalyzer.tla
\* Run with: java -jar tla2tools.jar -config NasaAnalyzer.cfg NasaAnalyzer.tla

SPECIFICATION SpecAnalyzer

\* -----------------------------------------------------------------------
\* Constants
\* -----------------------------------------------------------------------

CONSTANTS
    \* Single function name keeps |Function| small while still exercising
    \* all rule predicates.
    FunctionName = {"foo"}

    \* Scaled-down threshold values for TLC (structure is identical to
    \* production values; only the magnitude differs).
    MAX_LINES = 3
    MIN_ASSERTS = 2

    \* TLC bounds: must satisfy MAX_LINE_COUNT >= MAX_LINES and
    \* MAX_ASSERT_COUNT >= MIN_ASSERTS.  Minimal values that cover every
    \* threshold case.
    MAX_LINE_COUNT = 3
    MAX_ASSERT_COUNT = 2

\* -----------------------------------------------------------------------
\* Invariants to check
\* -----------------------------------------------------------------------

INVARIANTS
    DiagnosticsMatchSpec
    NoDiagnosticsForUnknownFunctions
    DiagnosticCodesValid

\* Note: Nasa05Monotone and Nasa04AntiMonotone are constant-level formulas
\* (no state variables).  TLC verifies them via the ASSUME statements in
\* the spec rather than as temporal invariants.
