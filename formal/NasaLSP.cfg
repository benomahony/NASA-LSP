\* TLC Model Checker configuration for NasaLSP.tla
\* Run with: java -jar tla2tools.jar -config NasaLSP.cfg NasaLSP.tla

SPECIFICATION Spec

\* -----------------------------------------------------------------------
\* Constants — small finite model for exhaustive checking
\* -----------------------------------------------------------------------

CONSTANTS
    \* Two URIs is sufficient to expose cross-document bugs
    URI <- {"file:///a.py", "file:///b.py"}

    \* Three content values: empty-ish, clean, and violating
    CONTENT <- {"clean_code", "violating_code", "other_code"}

    \* Abstract Analyze function: maps content to a diagnostic sequence.
    \* In the real system this calls analyzer.py; here we supply a finite
    \* model that is consistent with the spec's requirements.
    \*
    \* "clean_code"     -> no diagnostics
    \* "violating_code" -> one NASA05 diagnostic
    \* "other_code"     -> no diagnostics
    Analyze <- [
        "clean_code"     |-> << >>,
        "violating_code" |-> << [code |-> "NASA05", message |-> "too few asserts"] >>,
        "other_code"     |-> << >>
    ]

\* -----------------------------------------------------------------------
\* Invariants to check
\* -----------------------------------------------------------------------

INVARIANTS
    TypeInvariant
    DiagnosticConsistency
    NoStaleDiagnostics
    DiagnosticDomainComplete

\* -----------------------------------------------------------------------
\* Properties (temporal)
\* -----------------------------------------------------------------------

PROPERTIES
    EventuallyConsistent

\* -----------------------------------------------------------------------
\* Symmetry reduction
\* -----------------------------------------------------------------------
\* Uncommenting this reduces the state space by treating URIs as
\* interchangeable (safe because the spec treats them symmetrically).
\* SYMMETRY Permutations(URI)
