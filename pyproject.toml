[project]
name = "nasa-lsp"
version = "0.1.11"
description = "A Language Server Protocol implementation that enforces NASA's Power of 10 rules for safety-critical code in Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["dead>=2.1.0", "pygls>=2.0.0", "typer>=0.21.1"]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.29",
  "bump-my-version>=0.31",
  "hypothesis>=6.0.0",
  "mutmut>=3.2",
  "prek>=0.2.30",
  "pytest-cov>=7.0.0",
  "pytest>=8.0",
  "ruff>=0.11",
  "zensical>=0.0.17",
  "dead>=2.1.0",
]
[tool.uv]
package = true

[project.scripts]
nasa = "nasa_lsp.cli:app"

[tool.nasa-lsp]
# Enable/disable specific NASA rules
rules = [
  "NASA01-A",  # Forbidden APIs (eval, exec, etc.)
  "NASA01-B",  # No recursion
  "NASA02",    # No unbounded loops
  "NASA04",    # Max function length
  "NASA05",    # Minimum assertions per function
  "NASA05-A",  # Assertions must have descriptive messages
  "NASA05-M1", # Assertion restates a parameter type
  "NASA05-M2", # Assertion can never fail (just-assigned constant)
  "NASA05-M3", # None check made redundant by a following isinstance
  "NASA05-M4", # Truthiness assertion on a total-operation result
  "NASA05-M5", # Post-condition already guaranteed by len()
]
# Paths excluded from linting (test suites use bare pytest asserts)
exclude = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",      # pydocstyle
  "COM812", # trailing-comma (conflicts with formatter)
  "ISC001", # single-line-implicit-string-concatenation (conflicts with formatter)
  "S101",   # assert (we use asserts intentionally for NASA rules)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # assert statements (tests use asserts extensively)
  "S311",    # pseudo-random generators (deterministic seeds for reproducibility)
  "PLR2004", # magic values in comparisons (common and clear in test assertions)
]
"tests/test_fuzzing.py" = [
  "BLE001", # blind exception (intentionally testing robustness against any exception)
  "FBT001", # boolean positional arguments (test helper functions)
  "FBT002", # boolean default arguments (test helper functions)
]
"tests/test_simulations.py" = [
  "RUF001", # ambiguous unicode characters (intentionally testing unicode handling)
]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["mutants", ".venv", "dist", "build"]

[tool.coverage.run]
source = ["src/nasa_lsp"]
branch = true
omit = ["src/nasa_lsp/__init__.py"]

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "assert False"]

[tool.bumpversion]
current_version = "0.1.11"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"
# Keep uv.lock's project version in sync and include it in the bump commit,
# otherwise `uv sync --frozen` in CI fails against the bumped pyproject.
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
